# ============================================================
# StockFlow Observability - Telegraf Configuration
# ============================================================
# Purpose:
#   Collect Docker container metrics from StockFlow services
#   (Kafka, Spark Streams, PostgreSQL, Producer) and ship them
#   to the centralized InfluxDB instance hosted by EcomFlow.
#
# Architecture:
#
#   StockFlow Containers (Kafka, Spark, Postgres, Producer)
#      |
#      | Docker Engine API (unix socket)
#      v
#   Telegraf (this file)
#      |
#      | HTTP POST :8086 (InfluxDB Line Protocol)
#      v
#   InfluxDB (ecomflow-influxdb, external network)
#      |
#      v
#   Grafana (ecomflow-grafana, dashboards)
#
# Key Design Decisions:
#   - Uses Docker input plugin (not StatsD) since StockFlow
#     services don't emit StatsD metrics natively
#   - Connects to centralized EcomFlow InfluxDB via external
#     Docker network (ecomflow-observability)
#   - Writes to dedicated bucket "stockflow_metrics" to isolate
#     data from EcomFlow's "ecomflow_metrics" bucket
#   - Tags all metrics with project="stockflow" for filtering
# ============================================================


# ============================================================
# 1. GLOBAL AGENT CONFIGURATION
# ============================================================

[agent]

  # Collection interval: 10s matches EcomFlow's cadence
  interval = "10s"

  # Flush interval: aligned with collection interval
  flush_interval = "10s"

  # No jitter needed for single-instance deployment
  flush_jitter = "0s"

  # Second-level precision
  precision = "1s"

  # Buffer 10,000 metrics (~100s of InfluxDB downtime tolerance)
  metric_buffer_limit = 10000

  # Batch size for InfluxDB writes
  metric_batch_size = 1000

  # Logging
  debug = false
  quiet = false
  # logtarget = "file"
  # logfile = "/var/log/telegraf/telegraf.log"
  # logfile_rotation_max_size = "10MB"
  # logfile_rotation_max_archives = 5

  # Include hostname tag
  omit_hostname = false


# ============================================================
# 2. GLOBAL TAGS
# ============================================================

[global_tags]
  project = "stockflow"


# ============================================================
# 3. INPUT - Docker Container Metrics
# ============================================================
# Monitors CPU, Memory, Network I/O, Disk I/O of all
# StockFlow containers (stockflow-kafka, stockflow-producer,
# stockflow-bronze, stockflow-silver, stockflow-gold,
# stockflow-postgres, stockflow-metabase, stockflow-kafka-ui)
# ============================================================

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]


# ============================================================
# 4. INPUT - Internal Telegraf Metrics
# ============================================================
# "Who watches the watchmen?" safeguard.
# ============================================================

[[inputs.internal]]
  collect_memstats = true


# ============================================================
# 5. OUTPUT - InfluxDB v2 (Centralized at EcomFlow)
# ============================================================
# Network: stockflow-telegraf -> ecomflow-observability -> ecomflow-influxdb
# Bucket:  "stockflow_metrics" (isolated from ecomflow_metrics)
# ============================================================

[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
  timeout = "10s"
  content_encoding = "gzip"

[[inputs.net]]
[[inputs.diskio]]
