services:
  stockflow-minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: stockflow-minio
    hostname: stockflow-minio
    restart: always
    volumes:
      - ./include/data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - default

  stockflow-spark-master:
    image: airflow/spark-master
    build: ./spark/master
    container_name: stockflow-spark-master
    hostname: stockflow-spark-master
    ports:
      - "8082:8080"
      - "7077:7077"
    environment:
      INIT_DAEMON_STEP: setup_spark
    networks:
      - default

  stockflow-spark-worker:
    image: airflow/spark-worker
    build: ./spark/worker
    container_name: stockflow-spark-worker
    hostname: stockflow-spark-worker
    depends_on:
      - stockflow-spark-master
    ports:
      - "8081:8081"
    environment:
      SPARK_MASTER: spark://stockflow-spark-master:7077
    networks:
      - default

  stockflow-metabase:
    image: metabase/metabase:v0.52.8.4
    container_name: stockflow-metabase
    hostname: stockflow-metabase
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./include/data/metabase:/metabase-data
    networks:
      - default

networks:
  default:
    name: stockflow_df249c_airflow
    external: true
